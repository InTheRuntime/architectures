services:
  postgres:
    image: postgres:16-alpine
    container_name: architectures-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: architectures
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: architectures-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-upstream:
    image: mendhak/http-https-echo:34
    container_name: architectures-mock-upstream
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
