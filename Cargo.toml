[workspace]
resolver = "2"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["InTheRuntime <team@intheruntime.com>"]
license = "MIT"
repository = "https://github.com/InTheRuntime/architectures"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["http2", "macros", "matched-path"] }
tower = { version = "0.5", features = ["util", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-full", "set-header"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "aio"] }
arc-swap = "1.7"
dashmap = "6.1"
jsonwebtoken = "9.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2.0"
anyhow = "1.0"
futures = "0.3"
bytes = "1.7"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
